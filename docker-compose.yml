services:
  mock-api:
    build: ./mock-api
    ports:
      - "8080:8080"
    environment:
      MOCK_API_TOKEN: techcorp-mock-token-2025

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MOCK_API_URL: http://mock-api:8080/api
    volumes:
      - chroma:/app/chroma_db
    depends_on:
      - mock-api

volumes:
  chroma:
